name: Refresh Job Pump

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Runs overlap when a chunk is slow and the next schedule fires. Queue them
# instead of stacking parallel pumps that fight over the same job lease.
concurrency:
  group: refresh-pump
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pump refresh jobs
        # Secrets and repo variables are passed through `env:` rather than
        # interpolated into the script with ${{ }}. Interpolation splices the
        # value into the shell source before it runs, so anyone able to set the
        # DEPLOY_URL repository VARIABLE (a lower bar than a repository SECRET)
        # could inject shell or redirect the authenticated request elsewhere.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://kinetic-tracker.vercel.app' }}
        run: |
          set -uo pipefail

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in this repository's secrets."
            echo "The endpoint will reject every request with 401. Set it to the"
            echo "same value as CRON_SECRET in the Vercel project environment."
            exit 1
          fi

          # --max-time must exceed the Vercel ceiling, not the chunk budget.
          # It was 55s against a function that budgets 50s of work plus a 6s
          # tail and is allowed 60s by maxDuration, so curl aborted with exit
          # 28 on perfectly healthy chunks and the workflow went red.
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT

          # `|| true` so a curl transport failure (timeout, DNS, TLS) falls
          # through to the diagnostics below instead of aborting the step under
          # the runner's default `bash -e` with no explanation.
          code=$(curl -sS -X POST "$DEPLOY_URL/api/public/jobs/pump" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 90 \
            -o "$body" -w '%{http_code}') || true

          echo "HTTP ${code:-<no response>}"

          case "$code" in
            200)
              # Body withheld on success: it carries job ids and platform names,
              # and workflow logs are readable by anyone on a public repo.
              exit 0
              ;;
            504|408)
              # The chunk outlived the platform limit. The job keeps its lease
              # until it expires and the next pump resumes from the cursor, so
              # this is recoverable on its own — surface it without failing the
              # run, or a transient slow chunk permanently reds the workflow.
              echo "::warning::Gateway timeout ($code) — job resumes on the next pump."
              exit 0
              ;;
            401)
              echo "::error::401 Unauthorized — CRON_SECRET here does not match the one in Vercel."
              echo "Response body:"
              cat "$body" 2>/dev/null || true
              exit 1
              ;;
            *)
              # On a real failure the body IS the diagnostic. Withholding it here
              # left nothing to debug from but a bare status code.
              echo "::error::Pump failed with HTTP ${code:-<no response>}"
              echo "Response body:"
              cat "$body" 2>/dev/null || true
              exit 1
              ;;
          esac
